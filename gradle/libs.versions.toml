[versions]
# Pinned deliberately. The build runner uses these exact versions; see CLAUDE.md.
agp = "9.4.0"
# Must match the Kotlin Gradle Plugin AGP 9.4.0 bundles (read from its POM), because
# the Compose compiler plugin ships with Kotlin and is version-locked to it.
kotlin = "2.2.10"
# compileSdk 37 is not optional: androidx.core 1.19.0 refuses to link below it.
# targetSdk stays at 36, which is what Google Play enforces.
compileSdk = "37"
minSdk = "24"
targetSdk = "36"
buildTools = "36.0.0"

# Latest stable as of 2026-09-13, resolved from dl.google.com maven-metadata.
activityCompose = "1.13.0"
coreKtx = "1.19.0"
composeBom = "2026.06.01"
splashscreen = "1.2.0"
webkit = "1.17.0"
junit = "4.13.2"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-material3 = { module = "androidx.compose.material3:material3" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
