org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# On for day-to-day builds. Release builds MUST pass --no-configuration-cache:
# the cache serialises environment-variable values to disk, and signing passwords
# arrive that way (see GHSA-h3qr-39j9-4r5v, where cached Gradle state leaked CI
# secrets). scripts/build-release.sh does this for you.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults these to true; stated explicitly so a future AGP bump cannot
# silently change the generated app's behavior mid-flight.
android.newDsl=true
android.builtInKotlin=true
