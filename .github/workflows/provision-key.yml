name: Provision upload key

# Creates this project's Play upload key — inside the user's own account.
#
# This design exists because of one hard constraint and one deliberate choice:
#
#   * keytool is a JVM tool, so key generation cannot happen in our Cloudflare
#     Worker. It has to run somewhere with a JDK, and a GitHub runner already is
#     that place.
#   * Given the choice of where, the keystore and its password are generated here
#     and written straight into this repository's own secrets. They never transit
#     our infrastructure. The only thing our API ever learns is the certificate
#     fingerprint, which is public information.
#
# The backup is uploaded as a workflow artifact, so the user downloads it from
# their own repository. Artifacts expire, which is the right default for a file
# that carries a signing key.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Used in the certificate subject and the backup README
        required: true
        type: string
      package_name:
        description: Recorded in the backup README as the name that must never change
        required: true
        type: string

permissions:
  # This job needs no repository write access at all. Secrets are written with
  # the provisioning token, not with GITHUB_TOKEN — which cannot write secrets.
  contents: read

concurrency:
  # Two concurrent runs would each generate a key and the second would overwrite
  # the first's secrets, leaving a keystore that no longer matches the fingerprint.
  group: web2app-provision-key
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to run if a key already exists
        env:
          GH_TOKEN: ${{ secrets.W2A_PROVISION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::W2A_PROVISION_TOKEN is missing. Start provisioning from the dashboard."
            exit 1
          fi
          # Overwriting a key that has already signed a release is the one
          # unrecoverable mistake, so it is refused before anything is generated.
          if gh api "repos/$REPO/actions/variables/W2A_KEY_FINGERPRINT" --silent 2>/dev/null; then
            echo "::error::This project already has an upload key. Use an upload key reset instead of replacing it."
            exit 1
          fi

      - name: Generate the upload key
        env:
          W2A_APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/key"
          # Generated here, never received from anywhere: 32 random bytes,
          # base64url, so it is a key rather than a guessable passphrase.
          W2A_KEYSTORE_PASSWORD="$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-40)"
          export W2A_KEYSTORE_PASSWORD
          # Persist for later steps without ever printing it. GitHub masks values
          # registered with add-mask, so an accidental echo stays redacted.
          echo "::add-mask::$W2A_KEYSTORE_PASSWORD"
          echo "W2A_KEYSTORE_PASSWORD=$W2A_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          bash scripts/generate-upload-key.sh "$RUNNER_TEMP/key"

      - name: Build and self-verify the backup bundle
        env:
          W2A_APP_NAME: ${{ inputs.app_name }}
          W2A_PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          node scripts/make-backup.mjs "$RUNNER_TEMP/key" "$RUNNER_TEMP/upload-key-backup.zip"
          # Prove the bundle opens with the password it carries before handing it
          # to anyone. An untested backup is not a backup.
          bash scripts/verify-backup.sh "$RUNNER_TEMP/upload-key-backup.zip" \
            "$(cat "$RUNNER_TEMP/key/upload_key_sha256.txt")"

      # Deliberately before the secrets are written: if this upload fails the run
      # aborts with no key stored anywhere, so a retry is clean. The other order
      # can leave a provisioned key whose backup nobody ever received.
      - name: Publish the backup for download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-key-backup
          path: ${{ runner.temp }}/upload-key-backup.zip
          # Long enough for the user to notice and save it, short enough that a
          # file carrying a signing key does not sit around forever.
          retention-days: 30
          if-no-files-found: error

      - name: Store the key in this repository's secrets
        env:
          # gh handles the libsodium sealed-box encryption the secrets API
          # requires, so no key material is ever assembled by hand.
          GH_TOKEN: ${{ secrets.W2A_PROVISION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base64 -w0 "$RUNNER_TEMP/key/upload-keystore.p12" > "$RUNNER_TEMP/keystore.b64"
          gh secret set W2A_UPLOAD_KEYSTORE_B64 --repo "$REPO" < "$RUNNER_TEMP/keystore.b64"
          printf '%s' "$W2A_KEYSTORE_PASSWORD" | gh secret set W2A_KEYSTORE_PASSWORD --repo "$REPO"
          printf 'upload' | gh secret set W2A_KEY_ALIAS --repo "$REPO"
          # A variable, not a secret: the build must be able to print it when a
          # signature does not match, and a fingerprint is not confidential.
          gh variable set W2A_KEY_FINGERPRINT --repo "$REPO" \
            --body "$(cat "$RUNNER_TEMP/key/upload_key_sha256.txt")"

      - name: Remove the provisioning token and key material
        if: always()
        env:
          GH_TOKEN: ${{ secrets.W2A_PROVISION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The token was only needed to write the secrets above. Deleting it
          # closes the window even though it also expires on its own.
          gh secret delete W2A_PROVISION_TOKEN --repo "$REPO" 2>/dev/null || true
          find "$RUNNER_TEMP/key" -type f -exec shred -u {} + 2>/dev/null || rm -rf "$RUNNER_TEMP/key"
          shred -u "$RUNNER_TEMP/upload-key-backup.zip" 2>/dev/null || rm -f "$RUNNER_TEMP/upload-key-backup.zip"
